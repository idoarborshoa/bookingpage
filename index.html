<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Arbors Amenities Booking v1.6</title>
  <link href="favicon.ico" rel="icon" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script>
    let g_isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const g_htmlElement = document.documentElement;
    const myThemeStorageName = 'myTheme';
    if (localStorage.getItem(myThemeStorageName) != null && localStorage.getItem(myThemeStorageName) != undefined){
        if (localStorage.getItem(myThemeStorageName) === 'dark'){
            g_htmlElement.setAttribute('data-bs-theme', 'dark');
            g_isDarkMode = true;
        } else {
            g_htmlElement.setAttribute('data-bs-theme', 'light');
            g_isDarkMode = false;
        }
    }
    if (g_isDarkMode) {
        g_htmlElement.setAttribute('data-bs-theme', 'dark');
    } else {
        g_htmlElement.setAttribute('data-bs-theme', 'light');
    }
    //g_htmlElement.setAttribute('data-bs-theme', 'light');
    const FULL_REDIRECT_PAGE = 'https://booking.arbors-ryebrook.com/';
  </script>
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <div id="alertplaceholder" class="my-alert-class"></div>
  <nav class="navbar navbar-dark hoa-navbar py-1">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-2">
        <span class="navbar-brand mb-0 h1 fs-5">The Arbors HOA Amenity Booking</span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div id="authStatus" class="text-white small">Not logged in</div>
        <div class="d-flex align-items-center gap-2">
          <button id="themeToggleBtn" type="button" class="btn btn-outline-light " aria-label="Switch theme">
            <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
          </button>
          <button id="changePasswordBtn" class="btn btn-secondary d-none" title="Change password"><i class="fa-solid fa-key"></i></button>
          <button id="logoutBtn" class="btn btn-danger d-none" title="Logout from system"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </div>
    </div>
  </nav>
    <!-- loading -->
     <div id="loading" class="d-none my_loading">
        <div class="spinner-container">
            <div class="spinner-border" style="width: 15rem; height: 15rem;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <!-- <img src="shilav_logo_nobg.png" alt="Shilav Logo" class="spinner-logo" /> -->
        </div>
    </div>
  <div id="mainLayout">


    <!-- ── Sidebar ── -->
    <div id="sidebar">

      <!-- Login Card -->
      <div id="loginSection" class="card shadow-sm mb-3">
        <div class="card-header py-2"><h6 class="mb-0">Resident Login</h6></div>
        <div class="card-body py-2">
          <form id="loginForm">
            <div class="mb-2">
              <label class="form-label small mb-1">Email</label>
              <input type="email" id="loginEmail" class="form-control form-control-sm"
                placeholder="name@domain.com">
            </div>
            <div class="mb-2">
              <label class="form-label small mb-1">Password</label>
              <input type="password" id="loginPassword" class="form-control form-control-sm"
                required>
            </div>
            <button type="submit" class="btn btn-primary btn-sm w-100"><i class="fa-solid fa-right-to-bracket"></i> Sign In <i class="fa-solid fa-right-to-bracket"></i></button>
          </form>
        </div>
      </div>

      <div id="viewSwitcher" class="d-none mb-3">
        <div class="btn-group w-100" role="group">
          <button type="button" class="btn btn-outline-primary btn-sm view-btn active" data-view="booking">Reservation View</button>
          <button type="button" class="btn btn-outline-primary btn-sm view-btn" data-view="admin">Admin View</button>
        </div>
      </div>

      <!-- Booking Card (shown after login) -->
      <div id="bookingSection" class="card shadow-sm mb-3 d-none">
        <div class="card-header py-2 d-flex justify-content-between align-items-center">
          <h6 class="mb-0">Reservation</h6>
        </div>
        <div class="card-body py-2">
          <div id="alertBox" class="alert py-2 d-none" role="alert"></div>
          <form id="bookingForm">
            <div class="mb-2">
              <label class="form-label small mb-1">Facility / Amenity</label>
              <select id="amenitySelect" class="form-select form-select-sm" required>
                <option value="">Loading...</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label small mb-1">Date</label>
              <input type="date" id="bookingDate" class="form-control form-control-sm" required>
            </div>
            <div class="mb-2">
              <label class="form-label small mb-1">Start Time</label>
              <select id="bookingTime" class="form-select form-select-sm" required>
                <option value="00:00">12:00 AM</option>
                <option value="00:30">12:30 AM</option>
                <option value="01:00">1:00 AM</option>
                <option value="01:30">1:30 AM</option>
                <option value="02:00">2:00 AM</option>
                <option value="02:30">2:30 AM</option>
                <option value="03:00">3:00 AM</option>
                <option value="03:30">3:30 AM</option>
                <option value="04:00">4:00 AM</option>
                <option value="04:30">4:30 AM</option>
                <option value="05:00">5:00 AM</option>
                <option value="05:30">5:30 AM</option>
                <option value="06:00">6:00 AM</option>
                <option value="06:30">6:30 AM</option>
                <option value="07:00">7:00 AM</option>
                <option value="07:30">7:30 AM</option>
                <option value="08:00">8:00 AM</option>
                <option value="08:30">8:30 AM</option>
                <option value="09:00" selected>9:00 AM</option>
                <option value="09:30">9:30 AM</option>
                <option value="10:00">10:00 AM</option>
                <option value="10:30">10:30 AM</option>
                <option value="11:00">11:00 AM</option>
                <option value="11:30">11:30 AM</option>
                <option value="12:00">12:00 PM</option>
                <option value="12:30">12:30 PM</option>
                <option value="13:00">1:00 PM</option>
                <option value="13:30">1:30 PM</option>
                <option value="14:00">2:00 PM</option>
                <option value="14:30">2:30 PM</option>
                <option value="15:00">3:00 PM</option>
                <option value="15:30">3:30 PM</option>
                <option value="16:00">4:00 PM</option>
                <option value="16:30">4:30 PM</option>
                <option value="17:00">5:00 PM</option>
                <option value="17:30">5:30 PM</option>
                <option value="18:00">6:00 PM</option>
                <option value="18:30">6:30 PM</option>
                <option value="19:00">7:00 PM</option>
                <option value="19:30">7:30 PM</option>
                <option value="20:00">8:00 PM</option>
                <option value="20:30">8:30 PM</option>
                <option value="21:00">9:00 PM</option>
                <option value="21:30">9:30 PM</option>
                <option value="22:00">10:00 PM</option>
                <option value="22:30">10:30 PM</option>
                <option value="23:00">11:00 PM</option>
                <option value="23:30">11:30 PM</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label small mb-1">Duration</label>
              <select id="bookingDuration" class="form-select form-select-sm" required>
                <option value="30">30 minutes</option>
                <option value="60">1 hour</option>
                <option value="90">1 hour 30 minutes</option>
                <option value="120">2 hours</option>
              </select>
            </div>
            <div id="scheduleHint" class="form-text small text-muted mt-1"></div>
            <button type="submit" id="bookBtn" class="btn btn-success btn-sm w-100"><i class="fa-solid fa-calendar-check"></i> Reserve Amenity <i class="fa-solid fa-calendar-check"></i></button>
          </form>
        </div>
      </div>

      <!-- Amenity colour legend (shown after login) -->
      <div id="legendSection" class="d-none">
        <p class="text-muted small mb-1 fw-semibold">Amenity Legend</p>
        <div id="legendList" class="mb-2"></div>
        <div class="d-flex align-items-center gap-2">
          <div style="width:14px;height:14px;border-left:4px solid #198754;background:#d1e7dd;flex-shrink:0;border-radius:2px"></div>
          <span class="small">Your bookings</span>
        </div>
      </div>

      <div id="adminTabSection" class="d-none mt-3">
        <div class="btn-group w-100" role="group">
          <button type="button" class="btn btn-outline-primary btn-sm tab-btn active" data-target="bookingView">Booking View</button>
          <button type="button" class="btn btn-outline-primary btn-sm tab-btn" data-target="adminView">Admin</button>
        </div>
      </div>

    </div><!-- /sidebar -->

    <!-- ── Calendar ── -->
    <div id="calendarArea">
      <div id="calendarPlaceholder" class="d-flex align-items-center justify-content-center h-100 text-muted">
        <div class="text-center">
          <div style="font-size:3rem">📅</div>
          <p class="mt-2">Sign in to view all bookings</p>
        </div>
      </div>

      <div id="bookingView" class="h-100">
        <div id="calendarToolbar" class="d-none align-items-center gap-2 mb-2">
          <label class="toolbar-date-label small text-muted mb-0">Date</label>
          <input type="date" id="calendarDatePicker" class="form-control form-control-sm" style="max-width: 170px;">
          <select id="calendarViewSelect" class="form-select form-select-sm" style="max-width: 170px;">
            <option value="rolling30">Agenda (30 days)</option>
            <option value="dayGridMonth">Month</option>
            <option value="timeGridWeek">Week</option>
            <option value="timeGridDay">Day</option>
          </select>
          <div class="form-check form-switch mb-0 ms-sm-1">
            <input class="form-check-input" type="checkbox" id="myBookingsOnlySwitch">
            <label class="form-check-label small text-muted" for="myBookingsOnlySwitch">My bookings only</label>
          </div>
        </div>
        <div id="calendar" class="d-none h-100"></div>
      </div>

      <div id="adminView" class="admin-panel h-100 overflow-auto d-none">
        <div class="card shadow-sm h-100">
          <div class="card-header d-flex align-items-center justify-content-between">
            <h6 class="mb-0">User Management</h6>
            <button type="button" id="openAddUserModalBtn" class="btn btn-primary btn-sm" title="Add user"><i class="fa-solid fa-user-plus"></i></button>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label small mb-1">Search users</label>
              <input type="text" id="adminUserSearch" class="form-control form-control-sm" placeholder="UUID, name, or email">
            </div>
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead>
                  <tr>
                    <th>User</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Created</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="adminUserTableBody"></tbody>
              </table>
            </div>
            <div id="adminUserStatus" class="small text-muted mt-2"></div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /mainLayout -->

  <!-- ── Booking Detail / Cancel Modal ── -->
  <div class="modal fade" id="bookingModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h6 class="modal-title" id="modalTitle">Booking Details</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body py-2" id="modalBody"></div>
        <div class="modal-footer py-2">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-danger btn-sm d-none" id="cancelBookingBtn">Cancel Booking</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="addUserModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h6 class="modal-title">Add User</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="addUserForm">
          <div class="modal-body py-2">
            <div class="mb-2">
              <label class="form-label small mb-1"><i class="fa-solid fa-envelope"></i> Email <small class="fst-italic">(email address)</small></label>
              <input type="email" id="newUserEmail" class="form-control form-control-sm text-center" required>
            </div>
            <div class="mb-2">
              <label class="form-label small mb-1"><i class="fa-solid fa-id-badge"></i> Name <small class="fst-italic">(first and last name)</small></label>
              <input type="text" id="newUserName" class="form-control form-control-sm text-center" required>
            </div>
            <div class="mb-2">
              <label class="form-label small mb-1"><i class="fa-solid fa-house"></i> Unit Number<small class="fst-italic">(1-250)</small></label>
              <input type="number" min="1" max="250" id="newUserUnitNumber" class="form-control form-control-sm text-center" required>
            </div>
          </div>
          <div class="modal-footer py-2">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm">Create User</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="changePasswordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h6 class="modal-title">Change Password</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="changePasswordForm">
          <div class="modal-body py-2">
            <div class="mb-2">
              <label class="form-label small mb-1">New Password</label>
              <input type="password" id="changePasswordNew" class="form-control form-control-sm" required>
            </div>
            <div class="mb-2">
              <label class="form-label small mb-1">Confirm Password</label>
              <input type="password" id="changePasswordConfirm" class="form-control form-control-sm" required>
            </div>
          </div>
          <div class="modal-footer py-2">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm">Update Password</button>
          </div>
        </form>
      </div>
    </div>
  </div>


    <div class="modal fade" id="confirmationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h6 class="modal-title">Confirmation</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="confirmationForm">
          <div class="modal-body py-2">
            <p id="confirmationMessage" class="mb-2"></p>
          </div>
          <div class="modal-footer py-2">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm" id="confirmationConfirmBtn">Confirm</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="bookings.js"></script>
</body>
</html>
